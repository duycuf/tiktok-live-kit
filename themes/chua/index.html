<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chùa ảo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #f6e7c1; }
  /* Sân khấu 1080x1920 (9:16), co giãn vừa cửa sổ */
  #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
  #scene { position: absolute; inset: 0; width: 1080px; height: 1920px; }

  #hud { position: absolute; left: 30px; right: 30px; bottom: 30px; display: grid; grid-template-columns: 1fr 300px; gap: 16px; }
  .panel { background: linear-gradient(180deg, rgba(40,18,6,.86), rgba(20,8,2,.9)); border: 2px solid rgba(214,168,82,.7); border-radius: 18px; box-shadow: 0 0 24px rgba(255,190,90,.18) inset; }
  #banner { grid-column: 1; display: flex; align-items: center; justify-content: center; gap: 14px; height: 58px; font-size: 26px; font-weight: 600; white-space: nowrap; overflow: hidden; }
  #banner .who { color: #ffe3a3; max-width: 360px; overflow: hidden; text-overflow: ellipsis; }
  #banner .dot { opacity: .6; }
  #banner.flash { animation: flash 1.2s ease-out; }
  @keyframes flash { 0% { box-shadow: 0 0 60px rgba(255,210,120,.9); transform: scale(1.04); } 100% { box-shadow: none; transform: none; } }
  #cards { grid-column: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .card { height: 118px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; position: relative; overflow: hidden; }
  .card .ico { font-size: 34px; line-height: 1; filter: drop-shadow(0 0 8px rgba(255,200,90,.7)); }
  .card .coin { font-size: 22px; font-weight: 700; color: #ffd987; letter-spacing: .5px; }
  .card .lbl { font-size: 24px; font-weight: 600; }
  .card.hit { animation: hit .9s ease-out; }
  @keyframes hit { 0% { background: rgba(255,200,90,.55); } 100% { } }
  #board { grid-column: 2; grid-row: 1 / span 2; padding: 14px 18px; }
  #board h3 { margin: 0 0 8px; text-align: center; font-size: 21px; letter-spacing: 1px; white-space: nowrap; color: #ffd987; }
  #board ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  #board li { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 6px; font-size: 22px; }
  #board li .n { width: 26px; height: 26px; border: 2px solid #d6a852; border-radius: 50%; display: grid; place-items: center; font-size: 15px; font-weight: 700; }
  #board li .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #board li .c { color: #ffd987; font-weight: 700; }
  #board li.empty { opacity: .45; }

  #stats { position: absolute; top: 250px; right: 30px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; font-size: 22px; font-weight: 600; }
  #stats div { padding: 6px 14px; border-radius: 999px; background: rgba(20,8,2,.65); border: 1px solid rgba(214,168,82,.5); }
  #toast { position: absolute; top: 330px; left: 50%; transform: translateX(-50%); font-size: 40px; font-weight: 800; text-align: center; color: #fff1c9; text-shadow: 0 0 18px rgba(255,180,60,.9), 0 2px 4px #000; opacity: 0; transition: opacity .4s; width: 960px; pointer-events: none; }
  #toast.show { opacity: 1; }
  #goal { position: absolute; top: 250px; left: 30px; width: 330px; display: none; }
  #goalLabel { font-size: 20px; font-weight: 600; margin-bottom: 6px; text-shadow: 0 2px 4px #000; }
  #goalBar { height: 14px; border-radius: 999px; background: rgba(20,8,2,.7); border: 1px solid rgba(214,168,82,.6); overflow: hidden; }
  #goalFill { height: 100%; width: 0; background: linear-gradient(90deg, #e2b25a, #ffe7a3); transition: width .6s; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="scene" width="1080" height="1920"></canvas>
  <div id="stats"><div id="viewers">👥 0</div><div id="likes">❤️ 0</div></div>
  <div id="goal"><div id="goalLabel"></div><div id="goalBar"><div id="goalFill"></div></div></div>
  <div id="toast"></div>
  <div id="hud">
    <div id="banner" class="panel"><span class="who" id="bWho">Phật tử</span><span class="dot">·</span><span id="bWhat">Dâng hương</span><span>🪷</span></div>
    <div id="cards"></div>
    <div id="board" class="panel"><h3>TẤM LÒNG THÀNH</h3><ol id="top"></ol></div>
  </div>
</div>
<script src="/sdk/live-sdk.js"></script>
<script src="overlay.js"></script>
</body>
</html>
